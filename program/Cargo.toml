[package]
name = "solana-ai-coin"
version = "0.1.0"
edition = "2021"
description = "Solana AI Coin - On-Chain Program with Post-Quantum Proof Integration"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "5.0"
thiserror = "2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("custom-heap", "custom-panic"))',
] }
