name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: PQC and repository tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Rust format
        run: cargo fmt --manifest-path program/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path program/Cargo.toml --locked
      - name: Rust clippy
        run: cargo clippy --manifest-path program/Cargo.toml --all-targets -- -D warnings
