name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PQC and repository tests
        run: npm test
      - name: Colosseum repository readiness
        run: npm run colosseum:check
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Rust format
        run: cargo fmt --manifest-path program/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path program/Cargo.toml --locked
      - name: Rust clippy
        run: cargo clippy --manifest-path program/Cargo.toml --all-targets --locked -- -D warnings
