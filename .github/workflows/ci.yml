name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate dependency locks for migration
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo generate-lockfile --manifest-path program/Cargo.toml
      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: dependency-lockfiles
          path: |
            package-lock.json
            program/Cargo.lock
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PQC and repository tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Rust format
        run: cargo fmt --manifest-path program/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path program/Cargo.toml --locked
      - name: Rust clippy
        run: cargo clippy --manifest-path program/Cargo.toml --all-targets --locked -- -D warnings
