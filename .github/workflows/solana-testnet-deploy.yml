name: Solana Testnet Deployment

on:
  pull_request:
    branches: [main]
    paths:
      - "program/**"
      - ".github/workflows/solana-testnet-deploy.yml"
      - "TESTNET_DEPLOYMENT.md"
  push:
    branches: [main]
    paths:
      - "program/**"
      - ".github/workflows/solana-testnet-deploy.yml"
      - "TESTNET_DEPLOYMENT.md"
      - ".github/deploy/testnet-request.json"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the verified SBF artifact to Solana Testnet"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOLANA_CLI_VERSION: "v4.2.1"
  TESTNET_RPC: ${{ vars.SOLANA_TESTNET_RPC || 'https://api.testnet.solana.com' }}

jobs:
  build-and-optionally-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL "https://release.anza.xyz/${SOLANA_CLI_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          solana --version
          cargo build-sbf --version

      - name: Build SBF program
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo build-sbf --manifest-path program/Cargo.toml
          SO_PATH="$(find program/target/deploy -maxdepth 1 -type f -name '*.so' -print -quit)"
          if [[ -z "$SO_PATH" ]]; then
            echo "No SBF .so artifact was produced." >&2
            exit 1
          fi
          SHA256="$(sha256sum "$SO_PATH" | awk '{print $1}')"
          echo "so_path=$SO_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '### Solana SBF build'
            printf '%s\n' "- Artifact: $SO_PATH"
            printf '%s\n' "- SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-ai-testnet-sbf
          path: ${{ steps.build.outputs.so_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Resolve deployment request
        id: request
        shell: bash
        env:
          MANUAL_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          REQUESTED=false
          EXPECTED_DEPLOYER=""
          EXPECTED_PROGRAM_ID=""

          if [[ "$MANUAL_DEPLOY" == "true" ]]; then
            REQUESTED=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -f .github/deploy/testnet-request.json ]]; then
            ACTION="$(jq -r '.action // empty' .github/deploy/testnet-request.json)"
            NETWORK="$(jq -r '.network // empty' .github/deploy/testnet-request.json)"
            REQUESTED_FROM_MAIN="$(jq -r '.requestedFromMain // empty' .github/deploy/testnet-request.json)"
            FAIL_CLOSED="$(jq -r '.failClosed // false' .github/deploy/testnet-request.json)"
            if [[ "$ACTION" == "deploy" &&
                  "$NETWORK" == "solana-testnet" &&
                  "$FAIL_CLOSED" == "true" &&
                  "$REQUESTED_FROM_MAIN" == "$PUSH_BEFORE" ]]; then
              REQUESTED=true
              EXPECTED_DEPLOYER="$(jq -r '.expectedDeployer // empty' .github/deploy/testnet-request.json)"
              EXPECTED_PROGRAM_ID="$(jq -r '.expectedProgramId // empty' .github/deploy/testnet-request.json)"
            fi
          fi

          echo "requested=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "expected_deployer=$EXPECTED_DEPLOYER" >> "$GITHUB_OUTPUT"
          echo "expected_program_id=$EXPECTED_PROGRAM_ID" >> "$GITHUB_OUTPUT"

      - name: Check deployment credentials
        id: credentials
        if: steps.request.outputs.requested == 'true'
        shell: bash
        env:
          DEPLOYER_KEYPAIR_JSON: ${{ secrets.SOLANA_TESTNET_DEPLOYER_KEYPAIR }}
          PROGRAM_KEYPAIR_JSON: ${{ secrets.SOLANA_TESTNET_PROGRAM_KEYPAIR }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOYER_KEYPAIR_JSON" || -z "$PROGRAM_KEYPAIR_JSON" ]]; then
            {
              printf '%s\n' '### Testnet deployment blocked'
              printf '%s\n' 'SBF build passed, but deployment secrets are missing.'
              printf '%s\n' 'Required repository secrets:'
              printf '%s\n' '- SOLANA_TESTNET_DEPLOYER_KEYPAIR'
              printf '%s\n' '- SOLANA_TESTNET_PROGRAM_KEYPAIR'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Materialize signer keypairs
        if: steps.request.outputs.requested == 'true' && steps.credentials.outputs.available == 'true'
        id: signer
        shell: bash
        env:
          DEPLOYER_KEYPAIR_JSON: ${{ secrets.SOLANA_TESTNET_DEPLOYER_KEYPAIR }}
          PROGRAM_KEYPAIR_JSON: ${{ secrets.SOLANA_TESTNET_PROGRAM_KEYPAIR }}
          EXPECTED_DEPLOYER: ${{ steps.request.outputs.expected_deployer }}
          EXPECTED_PROGRAM_ID: ${{ steps.request.outputs.expected_program_id }}
        run: |
          set -euo pipefail
          umask 077
          DEPLOYER="$RUNNER_TEMP/solana-testnet-deployer.json"
          PROGRAM="$RUNNER_TEMP/solana-testnet-program.json"
          printf '%s' "$DEPLOYER_KEYPAIR_JSON" > "$DEPLOYER"
          printf '%s' "$PROGRAM_KEYPAIR_JSON" > "$PROGRAM"
          DEPLOYER_ADDRESS="$(solana-keygen pubkey "$DEPLOYER")"
          PROGRAM_ID="$(solana-keygen pubkey "$PROGRAM")"

          if [[ -n "$EXPECTED_DEPLOYER" && "$DEPLOYER_ADDRESS" != "$EXPECTED_DEPLOYER" ]]; then
            echo "Configured deployer $DEPLOYER_ADDRESS does not match authorized request $EXPECTED_DEPLOYER" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_PROGRAM_ID" && "$PROGRAM_ID" != "$EXPECTED_PROGRAM_ID" ]]; then
            echo "Configured Program ID $PROGRAM_ID does not match authorized request $EXPECTED_PROGRAM_ID" >&2
            exit 1
          fi
          echo "deployer=$DEPLOYER" >> "$GITHUB_OUTPUT"
          echo "program=$PROGRAM" >> "$GITHUB_OUTPUT"
          echo "deployer_address=$DEPLOYER_ADDRESS" >> "$GITHUB_OUTPUT"
          echo "program_id=$PROGRAM_ID" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '### Testnet signer'
            printf '%s\n' "- Authority: $DEPLOYER_ADDRESS"
            printf '%s\n' "- Program ID: $PROGRAM_ID"
            printf '%s\n' "- RPC: $TESTNET_RPC"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fund Testnet authority if possible
        if: steps.request.outputs.requested == 'true' && steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(solana balance --lamports --url "$TESTNET_RPC" --keypair "${{ steps.signer.outputs.deployer }}" | awk '{print $1}')"
          [[ "$BEFORE" =~ ^[0-9]+$ ]] || { echo "Invalid lamport balance: $BEFORE" >&2; exit 1; }
          echo "Authority balance before deploy: $BEFORE lamports"
          if (( BEFORE < 1000000 )); then
            solana airdrop 2 --url "$TESTNET_RPC" --keypair "${{ steps.signer.outputs.deployer }}" || true
          fi
          AFTER="$(solana balance --lamports --url "$TESTNET_RPC" --keypair "${{ steps.signer.outputs.deployer }}" | awk '{print $1}')"
          [[ "$AFTER" =~ ^[0-9]+$ ]] || { echo "Invalid lamport balance: $AFTER" >&2; exit 1; }
          echo "Authority balance available: $AFTER lamports"
          if (( AFTER < 1000000 )); then
            echo "Testnet deployer has insufficient SOL for deployment." >&2
            exit 1
          fi

      - name: Deploy to Solana Testnet
        if: steps.request.outputs.requested == 'true' && steps.credentials.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/solana-testnet-deploy.log"
          solana program deploy "${{ steps.build.outputs.so_path }}" \
            --program-id "${{ steps.signer.outputs.program }}" \
            --keypair "${{ steps.signer.outputs.deployer }}" \
            --url "$TESTNET_RPC" \
            --commitment confirmed | tee "$LOG"

          SIGNATURE="$(awk -F': ' '/^Signature:/ {print $2}' "$LOG" | tail -1)"
          if [[ -z "$SIGNATURE" ]]; then
            echo "Deployment completed without a parseable transaction signature." >&2
            exit 1
          fi

          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '### Solana Testnet deployment'
            printf '%s\n' "- Program ID: ${{ steps.signer.outputs.program_id }}"
            printf '%s\n' "- Authority: ${{ steps.signer.outputs.deployer_address }}"
            printf '%s\n' "- Transaction: $SIGNATURE"
            printf '%s\n' "- SBF SHA-256: ${{ steps.build.outputs.sha256 }}"
            printf '%s\n' "- Program Explorer: https://explorer.solana.com/address/${{ steps.signer.outputs.program_id }}?cluster=testnet"
            printf '%s\n' "- Transaction Explorer: https://explorer.solana.com/tx/$SIGNATURE?cluster=testnet"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed program
        if: steps.request.outputs.requested == 'true' && steps.credentials.outputs.available == 'true'
        shell: bash
        env:
          PROGRAM_ID: ${{ steps.signer.outputs.program_id }}
          DEPLOYER_KEYPAIR: ${{ steps.signer.outputs.deployer }}
        run: |
          set -euo pipefail

          # CLI verification using the explicit user-controlled signer so the
          # runner never depends on a default ~/.config/solana/id.json.
          solana --keypair "$DEPLOYER_KEYPAIR" program show "$PROGRAM_ID" --url "$TESTNET_RPC"

          # Independent read-only JSON-RPC verification. This must prove the
          # Program account exists and is executable on Testnet.
          RPC_RESPONSE="$(curl --fail --silent --show-error "$TESTNET_RPC" \
            -H 'Content-Type: application/json' \
            --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getAccountInfo\",\"params\":[\"$PROGRAM_ID\",{\"encoding\":\"base64\",\"commitment\":\"confirmed\"}]}")"
          EXECUTABLE="$(jq -r '.result.value.executable // false' <<<"$RPC_RESPONSE")"
          OWNER="$(jq -r '.result.value.owner // empty' <<<"$RPC_RESPONSE")"
          if [[ "$EXECUTABLE" != "true" || -z "$OWNER" ]]; then
            echo "Program account is not independently verified as executable on Testnet." >&2
            echo "$RPC_RESPONSE" >&2
            exit 1
          fi

          {
            printf '%s\n' '### Independent on-chain verification'
            printf '%s\n' "- Program ID: $PROGRAM_ID"
            printf '%s\n' "- Executable: $EXECUTABLE"
            printf '%s\n' "- Owner/loader: $OWNER"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write deployment evidence
        if: steps.request.outputs.requested == 'true' && steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/testnet-deployment.json" <<JSON
          {
            "network": "solana-testnet",
            "rpc": "$TESTNET_RPC",
            "programId": "${{ steps.signer.outputs.program_id }}",
            "upgradeAuthority": "${{ steps.signer.outputs.deployer_address }}",
            "deploymentSignature": "${{ steps.deploy.outputs.signature }}",
            "sbfSha256": "${{ steps.build.outputs.sha256 }}",
            "sourceCommit": "$GITHUB_SHA",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Upload deployment evidence
        if: steps.request.outputs.requested == 'true' && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-ai-testnet-deployment-evidence
          path: ${{ runner.temp }}/testnet-deployment.json
          if-no-files-found: error
          retention-days: 30
