name: Token-2022 Testnet Launchpad

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Token display name"
        required: true
        default: "Solana AI Coin"
        type: string
      symbol:
        description: "Token symbol"
        required: true
        default: "SAIC"
        type: string
      decimals:
        description: "Token decimals (0-9 recommended)"
        required: true
        default: "9"
        type: string
      initial_supply:
        description: "Initial UI token amount to mint"
        required: true
        default: "1000000"
        type: string
      metadata_uri:
        description: "Public HTTPS metadata JSON URI"
        required: true
        type: string

permissions:
  contents: read

env:
  SOLANA_CLI_VERSION: "v4.2.1"
  TESTNET_RPC: ${{ vars.SOLANA_TESTNET_RPC || 'https://api.testnet.solana.com' }}

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate launch inputs
        shell: bash
        env:
          TOKEN_NAME: ${{ inputs.name }}
          TOKEN_SYMBOL: ${{ inputs.symbol }}
          DECIMALS: ${{ inputs.decimals }}
          INITIAL_SUPPLY: ${{ inputs.initial_supply }}
          METADATA_URI: ${{ inputs.metadata_uri }}
        run: |
          set -euo pipefail
          [[ "$DECIMALS" =~ ^[0-9]+$ ]] && (( DECIMALS >= 0 && DECIMALS <= 18 ))
          [[ "$INITIAL_SUPPLY" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$METADATA_URI" == https://* ]]
          [[ -n "$TOKEN_NAME" && -n "$TOKEN_SYMBOL" ]]
          (( ${#TOKEN_SYMBOL} <= 16 ))

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL "https://release.anza.xyz/${SOLANA_CLI_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify CLI
        shell: bash
        run: |
          set -euo pipefail
          solana --version
          spl-token --version

      - name: Require Testnet launch authority
        id: signer
        shell: bash
        env:
          DEPLOYER_KEYPAIR_JSON: ${{ secrets.SOLANA_TESTNET_DEPLOYER_KEYPAIR }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOYER_KEYPAIR_JSON" ]]; then
            echo "Missing SOLANA_TESTNET_DEPLOYER_KEYPAIR repository secret." >&2
            exit 2
          fi
          umask 077
          KEYPAIR="$RUNNER_TEMP/solana-testnet-launch-authority.json"
          printf '%s' "$DEPLOYER_KEYPAIR_JSON" > "$KEYPAIR"
          AUTHORITY="$(solana-keygen pubkey "$KEYPAIR")"
          echo "keypair=$KEYPAIR" >> "$GITHUB_OUTPUT"
          echo "authority=$AUTHORITY" >> "$GITHUB_OUTPUT"

      - name: Configure Testnet signer
        shell: bash
        run: |
          set -euo pipefail
          solana config set --url "$TESTNET_RPC" --keypair "${{ steps.signer.outputs.keypair }}"
          solana balance
          solana airdrop 2 || true
          solana balance

      - name: Create Token-2022 mint with metadata extension
        id: mint
        shell: bash
        env:
          DECIMALS: ${{ inputs.decimals }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/create-token.json"
          spl-token --url "$TESTNET_RPC" --program-2022 --output json             create-token --decimals "$DECIMALS" --enable-metadata > "$OUT"
          cat "$OUT"
          MINT="$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log(j.commandOutput?.address || j.address || j.mint || '')" "$OUT")"
          if [[ -z "$MINT" ]]; then
            echo "Unable to parse mint address from spl-token JSON output." >&2
            exit 1
          fi
          echo "address=$MINT" >> "$GITHUB_OUTPUT"

      - name: Initialize on-chain token metadata
        id: metadata
        shell: bash
        env:
          TOKEN_NAME: ${{ inputs.name }}
          TOKEN_SYMBOL: ${{ inputs.symbol }}
          METADATA_URI: ${{ inputs.metadata_uri }}
        run: |
          set -euo pipefail
          spl-token --url "$TESTNET_RPC" --program-2022 initialize-metadata             "${{ steps.mint.outputs.address }}"             "$TOKEN_NAME"             "$TOKEN_SYMBOL"             "$METADATA_URI"

      - name: Create authority token account
        id: token_account
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/create-account.txt"
          spl-token --url "$TESTNET_RPC" --program-2022 create-account "${{ steps.mint.outputs.address }}" | tee "$OUT"
          SIGNATURE="$(awk -F': ' '/^Signature:/ {print $2}' "$OUT" | tail -1)"
          [[ -n "$SIGNATURE" ]] || { echo "Token-account transaction signature missing." >&2; exit 1; }
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Mint initial supply
        id: issuance
        shell: bash
        env:
          INITIAL_SUPPLY: ${{ inputs.initial_supply }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mint-initial-supply.txt"
          spl-token --url "$TESTNET_RPC" --program-2022 mint "${{ steps.mint.outputs.address }}" "$INITIAL_SUPPLY" | tee "$OUT"
          SIGNATURE="$(awk -F': ' '/^Signature:/ {print $2}' "$OUT" | tail -1)"
          [[ -n "$SIGNATURE" ]] || { echo "Initial-issuance transaction signature missing." >&2; exit 1; }
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Verify mint state
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          MINT="${{ steps.mint.outputs.address }}"
          SUPPLY="$(spl-token --url "$TESTNET_RPC" --program-2022 supply "$MINT")"
          DISPLAY="$RUNNER_TEMP/mint-display.txt"
          spl-token --url "$TESTNET_RPC" --program-2022 display "$MINT" | tee "$DISPLAY"
          echo "supply=$SUPPLY" >> "$GITHUB_OUTPUT"

      - name: Write launch evidence
        shell: bash
        env:
          TOKEN_NAME: ${{ inputs.name }}
          TOKEN_SYMBOL: ${{ inputs.symbol }}
          DECIMALS: ${{ inputs.decimals }}
          INITIAL_SUPPLY: ${{ inputs.initial_supply }}
          METADATA_URI: ${{ inputs.metadata_uri }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/token-launch.json" <<JSON
          {
            "network": "solana-testnet",
            "rpc": "$TESTNET_RPC",
            "tokenProgram": "Token-2022",
            "mint": "${{ steps.mint.outputs.address }}",
            "mintAuthority": "${{ steps.signer.outputs.authority }}",
            "name": "$TOKEN_NAME",
            "symbol": "$TOKEN_SYMBOL",
            "decimals": $DECIMALS,
            "initialMintRequest": "$INITIAL_SUPPLY",
            "observedSupply": "${{ steps.verify.outputs.supply }}",
            "metadataUri": "$METADATA_URI",
            "transactionSignatures": {
              "createMint": "${{ steps.mint.outputs.signature }}",
              "initializeMetadata": "${{ steps.metadata.outputs.signature }}",
              "createAuthorityTokenAccount": "${{ steps.token_account.outputs.signature }}",
              "initialIssuance": "${{ steps.issuance.outputs.signature }}"
            },
            "supplyPolicy": "UNCAPPED_WHILE_MINT_AUTHORITY_REMAINS_ACTIVE",
            "sourceCommit": "$GITHUB_SHA",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          {
            echo "### Token-2022 Testnet launch"
            echo "- Mint: `${{ steps.mint.outputs.address }}`"
            echo "- Authority: `${{ steps.signer.outputs.authority }}`"
            echo "- Observed supply: `${{ steps.verify.outputs.supply }}`"
            echo "- Supply policy: uncapped while the mint authority remains active"
            echo "- Mint Explorer: https://explorer.solana.com/address/${{ steps.mint.outputs.address }}?cluster=testnet"
            echo "- Create mint tx: https://explorer.solana.com/tx/${{ steps.mint.outputs.signature }}?cluster=testnet"
            echo "- Metadata tx: https://explorer.solana.com/tx/${{ steps.metadata.outputs.signature }}?cluster=testnet"
            echo "- Token account tx: https://explorer.solana.com/tx/${{ steps.token_account.outputs.signature }}?cluster=testnet"
            echo "- Initial issuance tx: https://explorer.solana.com/tx/${{ steps.issuance.outputs.signature }}?cluster=testnet"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload launch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-ai-token-launch-evidence
          path: ${{ runner.temp }}/token-launch.json
          if-no-files-found: error
          retention-days: 30
